<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" role="img" aria-labelledby="title desc">
<title id="title">CuacaKu — siklus matahari dan bulan</title>
<desc id="desc">Matahari berputar dan terbenam, kemudian bulan muncul, lalu siklus berulang.</desc>
<defs>
  <radialGradient id="sky"><stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#020617"/></radialGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#fde047" stop-opacity=".45"/><stop offset="1" stop-color="#fde047" stop-opacity="0"/></radialGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ad"/><stop offset=".55" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
  <path id="sunPath" d="M70 125 Q240 0 410 125"/>
  <path id="moonPath" d="M410 125 Q240 0 70 125"/>
</defs>
<rect width="480" height="180" rx="28" fill="url(#sky)"/>
<g fill="#fff" opacity=".75">
<circle cx="76" cy="43" r="1.4"/><circle cx="122" cy="28" r="1"/><circle cx="177" cy="52" r="1.2"/>
<circle cx="304" cy="31" r="1.2"/><circle cx="361" cy="52" r="1"/><circle cx="414" cy="34" r="1.4"/>
<circle cx="438" cy="77" r="1"/>
</g>
<path d="M0 140 Q120 126 240 140 T480 140 V180 H0Z" fill="#020617" opacity=".72"/>

<!-- Matahari -->
<g>
  <circle cx="240" cy="82" r="55" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="opacity" dur="10s" values="1;1;0;0;0;1" keyTimes="0;.35;.48;.72;.82;1" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;.35;.5;.82;1" keyTimes="0;.35;.5;.82;1" calcMode="linear"><mpath href="#sunPath"/></animateMotion>
    <g stroke="#fde047" stroke-width="5" stroke-linecap="round" opacity=".9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <path d="M0-36V-51M0 36V51M-36 0H-51M36 0H51M-25-25L-36-36M25 25L36 36M25-25L36-36M-25 25L-36 36"/>
    </g>
    <circle r="27" fill="url(#sun)"/>
  </g>
  <animate attributeName="opacity" dur="10s" values="1;1;0;0;0;1" keyTimes="0;.35;.48;.72;.82;1" repeatCount="indefinite"/>
</g>

<!-- Bulan -->
<g>
  <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;0;.18;.5;.82;1" keyTimes="0;.18;.35;.5;.82;1" calcMode="linear"><mpath href="#moonPath"/></animateMotion>
  <circle r="25" fill="url(#moon)"/>
  <g fill="#94a3b8" opacity=".35"><circle cx="-9" cy="-8" r="4"/><circle cx="7" cy="-12" r="3"/><circle cx="10" cy="7" r="5"/><circle cx="-8" cy="11" r="3"/></g>
  <animate attributeName="opacity" dur="10s" values="0;0;1;1;0;0" keyTimes="0;.34;.48;.72;.86;1" repeatCount="indefinite"/>
</g>

<path d="M70 142 Q240 128 410 142" fill="none" stroke="#38bdf8" stroke-opacity=".18" stroke-width="2"/>
</svg>