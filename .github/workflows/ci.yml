name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Pasang dependensi
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint (ESLint)
        run: npm run lint

      - name: Pemeriksaan tipe (app + config/e2e)
        run: npm run typecheck

      - name: Unit test
        run: npm test

      - name: Regression timezone perangkat
        run: |
          for zone in UTC Asia/Jakarta Asia/Tokyo Europe/London America/New_York; do
            TZ="$zone" npx vitest run \
              src/__tests__/dates.test.ts \
              src/__tests__/weather.test.ts \
              src/__tests__/visuals.test.ts \
              src/__tests__/daylight.test.ts \
              src/__tests__/localClock.test.ts \
              src/__tests__/LocalClock.test.tsx \
              src/__tests__/WeatherBackground.test.tsx \
              src/__tests__/DailyForecast.test.tsx \
              src/__tests__/TemperatureChart.test.tsx || exit 1
          done

      - name: Build produksi
        run: npm run build

      - name: Audit dependensi runtime
        run: npm audit --omit=dev --audit-level=moderate

      - name: Pasang Chromium untuk browser checks
        run: npx playwright install --with-deps chromium

      - name: Responsive, accessibility, dan interaction checks
        run: npm run test:browser

      # Log Actions berada di host blob yang tidak selalu dapat diakses (mis. dari
      # sandbox review). Bila browser checks gagal, ringkasannya diposting ke PR
      # lewat api.github.com agar tetap bisa didiagnosis.
      - name: Laporkan kegagalan browser checks ke PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run test:browser > browser-checks.log 2>&1
          {
            echo "### ❌ Browser checks gagal (di-posting otomatis oleh CI)"
            echo
            echo '```'
            tail -n 180 browser-checks.log
            echo '```'
          } > browser-report.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file browser-report.md
