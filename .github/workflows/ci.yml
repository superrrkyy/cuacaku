name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Pasang dependensi
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Pemeriksaan tipe
        run: npm run typecheck

      - name: Unit test
        run: npm test

      - name: Regression timezone perangkat
        run: |
          for zone in UTC Asia/Jakarta Asia/Tokyo Europe/London America/New_York; do
            TZ="$zone" npx vitest run src/__tests__/dates.test.ts src/__tests__/weather.test.ts src/__tests__/visuals.test.ts || exit 1
          done

      - name: Build produksi
        run: npm run build

      - name: Pasang Chromium untuk browser checks
        run: npx playwright install --with-deps chromium

      - name: Responsive, accessibility, dan interaction checks
        run: npm run test:browser
